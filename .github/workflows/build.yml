name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore src/IOKode.WireShape.slnx

      - run: dotnet build src/IOKode.WireShape.slnx --configuration Release --no-restore

      - run: dotnet test src/IOKode.WireShape.slnx --configuration Release --no-build

  pack:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - run: dotnet pack src/IOKode.WireShape.slnx --configuration Release --output packages

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: |
            packages/*.nupkg
            packages/*.snupkg

  publish:
    runs-on: ubuntu-latest
    needs: pack
    # A push to master publishes; running it by hand only builds and packs.
    if: github.event_name == 'push'
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: packages

      # Trusted Publishing: the token of this run is exchanged for a key that lasts as long as the push.
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # A version already published is skipped, so a push that does not move the version publishes nothing.
      - run: >-
          dotnet nuget push "packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
